<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecobazar | Home </title>

    <meta name="description" content="">
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <!-- favicon -->
    <link rel="shortcut icon" href="./assets/images/fav.png" type="image/x-icon">
    <!-- slick slider css -->
    <link rel="stylesheet" href="./assets/css/slick.min.css">
    <!-- bootstrap css -->
    <link rel="stylesheet" href="./assets/css/bootstrap.min.css">
    <!-- custom css -->
    <link rel="stylesheet" href="./assets/css/style.css">
    <!-- responsive css -->
    <link rel="stylesheet" href="./assets/css/responsive.css">

</head>

<body>

    <!-- =============== HEADER START ==================== -->
    <header id="header">
        <div class="container">
            <div class="row">
                <div class="location">
                    <span><iconify-icon icon="tabler:map-pin" width="24" height="24"></iconify-icon></span>
                    <span>Store Location: Lincoln- 344, Illinois, Chicago, USA</span>
                </div>
                <div class="sign_in">
                    <div>
                        <select>
                            <option value="Eng">Eng</option>
                            <option value="Bn">Bn</option>
                        </select>
                        <select>
                            <option value="USD">USD</option>
                            <option value="BDT">BDT</option>
                        </select>
                    </div>
                    <div>
                        <a href="#">Sign In</a>
                        <span>/</span>
                        <a href="#">Sign Up</a>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <!-- =============== HEADER END ======================== -->


    <!-- =============== NAVIGATION START ==================== -->
    <nav class=" py-3" id="nav">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-3">
                    <a href="#">
                        <img src="./assets/images/logo.png" alt="">
                    </a>
                </div>
                <div class="col-lg-6   search_box">
                    <form action="" class="">
                        <input type="text" placeholder="search here">
                        <button>search</button>
                        <span><iconify-icon icon="iconamoon:search-light" width="24" height="24"></iconify-icon></span>
                    </form>
                </div>
                <div class="col-lg-3 cart_mobile">
                    <div class="cart_parent">
                        <!-- Heart -->
                        <div class="first">
                            <span class=""><iconify-icon icon="solar:heart-linear" width="32"
                                    height="32"></iconify-icon></span>

                        </div>
                        <!-- Cart -->
                        <div class="cart_child_parent">
                            <div class="cart">
                                <span><iconify-icon icon="iconoir:shopping-bag" width="32"
                                        height="32"></iconify-icon></span>
                                <small>2</small>
                            </div>
                            <div class="second">
                                <span>Shopping cart:</span>
                                <p>$57.00</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <span class="d-lg-none mobile_menu" data-bs-toggle="offcanvas" data-bs-target="#mobile" aria-controls="mobile"><iconify-icon icon="gg:menu-right" width="24"
                    height="24"></iconify-icon></span>
        </div>
    </nav>

    <!-- offcanvus -->

    <div class="offcanvas offcanvas-start" tabindex="-1" id="mobile" aria-labelledby="mobileLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="mobileLabel">Offcanvas</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <div>
                Some text as placeholder. In real life you can have the elements you have chosen. Like, text, images,
                lists, etc.
            </div>
            <div class="dropdown mt-3">
                <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                    Dropdown button
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Action</a></li>
                    <li><a class="dropdown-item" href="#">Another action</a></li>
                    <li><a class="dropdown-item" href="#">Something else here</a></li>
                </ul>
            </div>
        </div>
    </div>
    <!-- offcanvus end -->
    <!-- =============== NAVIGATION END ======================== -->
    <!-- jquery -->
    <script src="./assets/js/jquery-3.7.1.min.js"></script>
    <!-- iconify icons -->
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <!-- slick slider js -->
    <script src="./assets/js/slick.min.js"></script>
    <!-- bootstrap js -->
    <script src="./assets/js/bootstrap.bundle.min.js"></script>
    <!-- app js -->
    <script src="./assets/js/app.js"></script>
</body>

</html>
